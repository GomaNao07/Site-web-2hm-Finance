<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 1. Encodage et Affichage (Fondamental) -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 2. Balises SEO Principales -->
  <title>2HM Finance | Conseil Financier, Courtage & Gestion de Patrimoine</title>
  <meta name="description"
    content="Cabinet d'expertise et de conseil financier 2HM Finance. Solutions sur-mesure pour la gestion de patrimoine, l'optimisation fiscale et le financement d'entreprise.">
  <link rel="canonical" href="https://2hmfinance.com/">
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">

  <!-- 3. Open Graph (Partage sur LinkedIn, Facebook, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="2HM Finance">
  <meta property="og:url" content="https://2hmfinance.com/">
  <meta property="og:title" content="2HM Finance | Expertise & Conseil Financier">
  <meta property="og:description"
    content="Cabinet d'expertise et de conseil financier. Solutions sur-mesure pour la gestion de patrimoine, l'optimisation fiscale et le financement d'entreprise.">
  <meta property="og:image" content="https://2hmfinance.com/images/og-share-2hmfinance.jpg">
  <meta property="og:locale" content="fr_FR">

  <!-- 4. Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="2HM Finance | Expertise & Conseil Financier">
  <meta name="twitter:description"
    content="Cabinet d'expertise et de conseil financier. Solutions sur-mesure pour la gestion de patrimoine et l'optimisation fiscale.">
  <meta name="twitter:image" content="https://2hmfinance.com/images/og-share-2hmfinance.jpg">

  <!-- 5. Favicon & Icônes -->
  <link rel="icon" href="src/assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">


  <title>site-web-2hm-finance</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FinancialService",
  "name": "2HM Finance",
  "url": "https://2hmfinance.com/",
  "logo": "https://2hmfinance.com/images/logo.png",
  "description": "Cabinet de conseil financier, gestion de patrimoine et accompagnement des entreprises.",
  "address": {
    "@type": "PostalAddress",
    "addressCountry": "FR"
  }
}
</script>
</body>

</html>
